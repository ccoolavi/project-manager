name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    defaults:
      run:
        working-directory: ./frontend
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      # VITE_API_URL comes from frontend/.env.production, which is committed so
      # that a CI build and a local build always target the same API host.
      - name: Build
        run: npm run build

      - name: Fail if the build did not target a public HTTPS API
        run: |
          if grep -rq "localhost:8000" dist/assets/*.js; then
            echo "Build baked in a localhost API URL — refusing to deploy." >&2
            exit 1
          fi
          grep -rq "https://" dist/assets/*.js || { echo "No HTTPS API URL found in bundle." >&2; exit 1; }

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
